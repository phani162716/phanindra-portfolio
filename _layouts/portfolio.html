---
---
{%- assign locale = page.locale | default: layout.locale | default: site.locale -%}
<!doctype html>
{% include copyright.html %}
<html lang="{{ locale | replace: '_', '-' | default: 'en' }}" class="no-js" dir="ltr">
  <head>
    {% include head.html locale=locale %}
    {% include head/custom.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="portfolio-body layout--portfolio">
    <a class="skip-link" href="#main">Skip to content</a>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    {{ content }}

    <script type="module" src="{{ '/assets/js/portfolio-3d.js' | relative_url }}"></script>
  </body>
</html>
